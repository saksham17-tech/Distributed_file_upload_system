services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    container_name: upload-system-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: upload_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: upload-system-redis
    ports:
      - "6379:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: upload-system-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: upload-system-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  minio:
    image: minio/minio
    container_name: upload-system-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: upload-system-jaeger
    ports:
      - "16686:16686"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: upload-system-prometheus
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: upload-system-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

  # --- Microservices ---
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: upload-system-api-gateway
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - kafka
      - upload-service
      - metadata-service
    restart: always

  upload-service:
    build:
      context: .
      dockerfile: apps/upload-service/Dockerfile
    container_name: upload-system-upload-service
    ports:
      - "50051:50051"
    depends_on:
      - minio
      - kafka
    restart: always

  metadata-service:
    build:
      context: .
      dockerfile: apps/metadata-service/Dockerfile
    container_name: upload-system-metadata-service
    ports:
      - "50052:50052"
    depends_on:
      - postgres
    restart: always

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: upload-system-worker-service
    depends_on:
      - kafka
      - minio
    restart: always

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: upload-system-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    restart: always

volumes:
  pgdata:
  minio_data:
