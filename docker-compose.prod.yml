services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: upload-system-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: upload-system-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: upload-system-api-gateway
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - kafka
      - upload-service
      - metadata-service
    restart: always

  upload-service:
    build:
      context: .
      dockerfile: apps/upload-service/Dockerfile
    container_name: upload-system-upload-service
    ports:
      - "50051:50051"
    env_file:
      - .env
    depends_on:
      - kafka
    restart: always

  metadata-service:
    build:
      context: .
      dockerfile: apps/metadata-service/Dockerfile
    container_name: upload-system-metadata-service
    ports:
      - "50052:50052"
    env_file:
      - .env
    restart: always

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: upload-system-worker-service
    env_file:
      - .env
    depends_on:
      - kafka
    restart: always
