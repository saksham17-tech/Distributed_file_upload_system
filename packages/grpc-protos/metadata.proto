syntax = "proto3";

package metadata;

service MetadataService {
  rpc CheckFileExists (FileHashRequest) returns (FileExistsResponse) {}
  rpc RegisterUploadSession (UploadSessionRequest) returns (UploadSessionResponse) {}
  rpc GetFiles (GetFilesRequest) returns (GetFilesResponse) {}
  rpc ToggleStar (ToggleStarRequest) returns (ToggleStarResponse) {}
  rpc DeleteFile (DeleteFileRequest) returns (DeleteFileResponse) {}
  rpc GetStorageStats (StorageStatsRequest) returns (StorageStatsResponse) {}
}

message FileHashRequest {
  string fileHash = 1;
  int64 fileSize = 2;
  string userId = 3;
}

message FileExistsResponse {
  bool exists = 1;
  string fileId = 2;
}

message UploadSessionRequest {
  string fileId = 1; // Actually S3 Key
  string userId = 2;
  string filename = 3;
  int64 fileSize = 4;
}

message UploadSessionResponse {
  bool success = 1;
}

message GetFilesRequest {
  string userId = 1;
}

message FileItem {
  string id = 1;
  string originalName = 2;
  string mimeType = 3;
  int64 fileSize = 4;
  bool isStarred = 5;
  bool isDeleted = 6;
  string createdAt = 7;
  string status = 8;
}

message GetFilesResponse {
  repeated FileItem files = 1;
}

message ToggleStarRequest {
  string fileId = 1;
  string userId = 2;
}

message ToggleStarResponse {
  bool isStarred = 1;
}

message DeleteFileRequest {
  string fileId = 1;
  string userId = 2;
}

message DeleteFileResponse {
  bool success = 1;
}

message StorageStatsRequest {
  string userId = 1;
}

message StorageStatsResponse {
  int64 usedBytes = 1;
  int64 limitBytes = 2;
}
